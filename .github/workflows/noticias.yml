
name: Actualizar noticias diariamente

on:
  schedule:
    - cron: '0 6 * * *'
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  noticias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install 'openai>=1.0,<3'

      - name: Actualizar noticias a las 08:00 de Austria
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import subprocess

          hora = datetime.now(ZoneInfo('Europe/Vienna'))
          if hora.hour == 8:
              subprocess.run(['python', 'update.py'], check=True)
          else:
              print('Esperando las 08:00 de Austria')
          PY

      - name: Publicar nueva edición
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Nueva edición diaria"
            git push
          fi
  
